[project]
name = "chess-diffusion-policy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1+cu128",
    "torchvision==0.22.1+cu128",
    "numpy==2.5.2",
    "einops==0.8.2",
    "opencv-python-headless==5.0.0.93",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
